<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('voltlink-theme');
          var t = saved === 'light' || saved === 'dark' ? saved : 'dark';
          var r = document.documentElement;
          r.classList.toggle('light-theme', t === 'light');
          r.classList.toggle('dark-theme', t === 'dark');
          r.classList.toggle('dark', t === 'dark');
          r.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
    <title>VoltLink - Two-Wheeler Servicing & Roadside Assistance</title>
    <meta name="description" content="VoltLink - The new companion to your two-wheeler. Roadside assistance, doorstep pickup, quality repair tracking, and authorized workshop network." />
